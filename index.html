<!doctype html>
<html lang="vi" class="is-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF8F1">
  <title>Có quà cho em bé nè</title>
  <meta name="description" content="Mở ra đi, cưc chờ nãy giờ á.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Có quà cho em bé nè">
  <meta property="og:description" content="Mở ra đi, cưc chờ nãy giờ á.">
  <!-- TODO: og:image must be absolute: https://<user>.github.io/<repo>/assets/og.jpg -->
  <meta property="og:image" content="https://TODO.github.io/TODO/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Bông tulip hồng">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playwrite+VN:wght@300..400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-petal-l" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FAB9CA"/>
        <stop offset="1" stop-color="#EE7E9E"/>
      </linearGradient>
      <linearGradient id="g-petal-r" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F7A1B8"/>
        <stop offset="1" stop-color="#E26890"/>
      </linearGradient>
      <linearGradient id="g-leaf" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#5D8A5A"/>
        <stop offset="1" stop-color="#8DB889"/>
      </linearGradient>
      <radialGradient id="g-glow">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-seal" cx=".38" cy=".32" r=".8">
        <stop offset="0" stop-color="#E8557F"/>
        <stop offset=".6" stop-color="#D6336C"/>
        <stop offset="1" stop-color="#A9244F"/>
      </radialGradient>
      <path id="tulip-petal-c" d="M50 26C58 36 62 50 60.5 62C59.5 70 40.5 70 39.5 62C38 50 42 36 50 26Z"/>
      <path id="tulip-petal-l" d="M50 81C36 81 28.5 70 28.5 56C28.5 46 30 38 32.5 31C41 38 48 49 51.5 62C53 70 52.5 77 50 81Z"/>
      <path id="tulip-petal-r" d="M50 81C64 81 71.5 70 71.5 56C71.5 46 70 38 67.5 31C59 38 52 49 48.5 62C47 70 47.5 77 50 81Z"/>
      <path id="tulip-head" d="M16 19c-4.6 0-6.8-3.6-6.8-7.6 0-2.6.6-4.6 1.3-6.1 1.6 1.3 2.9 2.9 3.7 4.8.4-2.4 1-4.3 1.8-6.1.8 1.8 1.4 3.7 1.8 6.1.8-1.9 2.1-3.5 3.7-4.8.7 1.5 1.3 3.5 1.3 6.1 0 4-2.2 7.6-6.8 7.6z"/>
      <path id="heart" d="M16 27.5S4 20.2 4 11.9C4 8.1 6.8 5.3 10.3 5.3c2.4 0 4.5 1.3 5.7 3.3 1.2-2 3.3-3.3 5.7-3.3 3.5 0 6.3 2.8 6.3 6.6 0 8.3-12 15.6-12 15.6z"/>
    </defs>
  </svg>

  <div class="backdrop" aria-hidden="true"></div>
  <canvas class="petals" aria-hidden="true"></canvas>

  <div class="lock">
    <form class="lock-card" novalidate>
      <svg class="lock-bud" viewBox="22 22 56 126" aria-hidden="true">
        <path d="M50 146C49 126 52.5 104 50 80" fill="none" stroke="#6E9E6A" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M50 134C41 127 34 115 33.5 98C42 106 48 118 50 134Z" fill="url(#g-leaf)"/>
        <use href="#tulip-petal-c" fill="#D94F7A"/>
        <use href="#tulip-petal-l" fill="url(#g-petal-l)" transform="rotate(9 50 81)"/>
        <use href="#tulip-petal-r" fill="url(#g-petal-r)" transform="rotate(-9 50 81)"/>
      </svg>
      <label class="lock-question" for="lock-answer" data-text="lock.question"></label>
      <div class="lock-row">
        <input class="lock-input" id="lock-answer" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="trả lời ở đây nè">
        <button class="lock-submit" type="submit" aria-label="Mở">
          <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#heart"/></svg>
        </button>
      </div>
      <p class="lock-hint" data-text="lock.hint" aria-live="polite" hidden></p>
    </form>
  </div>

  <div class="reveal" hidden>
    <svg class="bloom" viewBox="0 0 100 210" aria-hidden="true">
      <circle class="bloom-glow" cx="50" cy="64" r="50" fill="url(#g-glow)"/>
      <path class="bloom-stem" d="M50 206C49 178 53 138 50 82" fill="none" stroke="#6E9E6A" stroke-width="4.5" stroke-linecap="round"/>
      <path class="bloom-leaf bloom-leaf-l" d="M50 178C40 170 30.5 154 29.5 128C40 138 47 152 50 178Z" fill="url(#g-leaf)"/>
      <path class="bloom-leaf bloom-leaf-r" d="M50 190C61 181 70 166 72 142C61 151 53 166 50 190Z" fill="url(#g-leaf)"/>
      <g class="bloom-head">
        <path class="bloom-petal bloom-petal-c" d="M50 26C58 36 62 50 60.5 62C59.5 70 40.5 70 39.5 62C38 50 42 36 50 26Z" fill="#D94F7A"/>
        <path class="bloom-petal bloom-petal-l" d="M50 81C36 81 28.5 70 28.5 56C28.5 46 30 38 32.5 31C41 38 48 49 51.5 62C53 70 52.5 77 50 81Z" fill="url(#g-petal-l)"/>
        <path class="bloom-petal bloom-petal-r" d="M50 81C64 81 71.5 70 71.5 56C71.5 46 70 38 67.5 31C59 38 52 49 48.5 62C47 70 47.5 77 50 81Z" fill="url(#g-petal-r)"/>
      </g>
    </svg>
    <p class="reveal-line" data-text="reveal.line"></p>
  </div>

  <main class="main" id="main" hidden inert>
    <section class="hero">
      <div class="photo hero-photo"></div>
      <div class="hero-text">
        <h1 class="hero-title" data-text="hero.title"></h1>
        <p class="hero-sub" data-text="hero.subtitle"></p>
        <a class="hero-cue" href="#story">kéo xuống nè
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>
        </a>
      </div>
      <svg class="hero-stamp" role="img"></svg>
    </section>

    <section class="section story" id="story">
      <div class="section-inner">
        <header class="section-head">
          <h2 class="section-title" data-text="sections.story.title"></h2>
          <p class="section-note" data-text="sections.story.note"></p>
          <img class="doodle" src="assets/svg/doodle-tulip.svg" alt="" width="64" height="80">
        </header>
        <div class="timeline">
          <div class="stem" aria-hidden="true"><span class="stem-grow"></span></div>
          <ol class="milestones"></ol>
          <svg class="stem-flower" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="47" fill="#FFF8F1" stroke="#D6336C" stroke-width="3"/>
            <g transform="translate(50 53) scale(.6) translate(-50 -55)">
              <use href="#tulip-petal-c" fill="#D94F7A" transform="translate(0 -3)"/>
              <use href="#tulip-petal-l" fill="url(#g-petal-l)" transform="rotate(-13 50 81)"/>
              <use href="#tulip-petal-r" fill="url(#g-petal-r)" transform="rotate(13 50 81)"/>
            </g>
          </svg>
        </div>
      </div>
    </section>

    <section class="section gallery" id="gallery">
      <div class="section-inner">
        <header class="section-head">
          <h2 class="section-title" data-text="sections.gallery.title"></h2>
          <p class="section-note" data-text="sections.gallery.note"></p>
          <img class="doodle" src="assets/svg/doodle-heart.svg" alt="" width="60" height="60">
        </header>
        <div class="stack"></div>
        <div class="stack-nav">
          <button class="round-btn stack-prev" type="button" aria-label="Ảnh trước">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
          </button>
          <button class="round-btn stack-next" type="button" aria-label="Ảnh tiếp theo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="section letter" id="letter">
      <div class="section-inner">
        <header class="section-head">
          <h2 class="section-title" data-text="sections.letter.title"></h2>
          <p class="section-note" data-text="sections.letter.note"></p>
        </header>
        <button class="envelope" type="button" aria-label="Mở thư">
          <span class="env-back"></span>
          <span class="env-paper"></span>
          <span class="env-front"></span>
          <span class="env-flap"></span>
          <svg class="env-seal" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M60.5 32.0L61.6 33.6L62.1 35.2L61.7 36.7L60.6 38.1L59.0 39.2L57.6 40.3L56.7 41.5L56.5 42.9L56.6 44.5L56.7 46.3L56.5 47.9L55.6 49.1L54.0 49.8L52.2 50.2L50.5 50.5L49.2 51.2L48.4 52.3L48.0 54.0L47.5 55.8L46.7 57.5L45.5 58.6L44.0 58.9L42.2 58.6L40.5 58.2L39.0 58.0L37.6 58.5L36.4 59.5L35.0 60.7L33.6 61.7L32.0 62.0L30.5 61.5L29.0 60.2L27.8 58.8L26.6 57.6L25.3 57.1L23.8 57.2L22.1 57.7L20.4 58.1L18.8 57.9L17.5 57.1L16.7 55.6L16.0 54.0L15.4 52.5L14.4 51.5L13.0 51.0L11.1 50.8L9.2 50.5L7.6 49.7L6.7 48.4L6.5 46.7L6.8 44.9L7.1 43.1L7.0 41.6L6.4 40.3L5.2 39.2L3.9 38.0L3.0 36.6L2.8 35.1L3.4 33.5L4.5 32.0L5.7 30.6L6.4 29.3L6.4 27.9L5.8 26.4L5.0 24.8L4.4 23.0L4.4 21.4L5.3 20.1L6.7 19.1L8.2 18.3L9.5 17.4L10.2 16.2L10.5 14.6L10.6 12.7L10.9 10.9L11.8 9.5L13.2 8.8L15.0 8.7L17.0 8.9L18.7 9.0L20.1 8.7L21.2 7.7L22.1 6.3L23.2 4.9L24.5 3.9L26.0 3.7L27.6 4.2L29.2 5.0L30.6 5.8L32.0 6.0L33.4 5.5L34.9 4.5L36.5 3.5L38.2 2.8L39.8 3.0L41.1 3.9L42.2 5.4L43.2 6.9L44.2 8.0L45.5 8.6L47.2 8.7L49.0 8.7L50.6 9.0L51.9 9.9L52.6 11.4L52.7 13.3L52.7 15.2L52.9 16.8L53.7 17.9L55.0 18.7L56.7 19.4L58.2 20.3L59.3 21.5L59.6 23.0L59.3 24.7L58.7 26.3L58.3 27.8L58.5 29.2L59.3 30.6Z" fill="url(#g-seal)"/>
            <circle cx="32" cy="32" r="20" fill="none" stroke="#B82A57" stroke-width="1.6" opacity=".75"/>
            <use href="#tulip-head" fill="#F3A0B8" opacity=".9" transform="translate(13.6 12.2) scale(1.15)"/>
            <path d="M32 34.4v10.6" stroke="#F3A0B8" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
          </svg>
        </button>
        <article class="letter-paper" hidden>
          <button class="letter-skip" type="button">Xem hết</button>
          <p class="letter-greeting"></p>
          <div class="letter-body"></div>
          <p class="letter-signature"></p>
        </article>
      </div>
    </section>

    <section class="section finale" id="finale">
      <div class="section-inner">
        <header class="section-head">
          <h2 class="section-title" data-text="sections.final.title"></h2>
          <p class="section-note" data-text="sections.final.note"></p>
        </header>
        <div class="scratch">
          <div class="photo scratch-photo"></div>
          <p class="scratch-line" data-text="final.line"></p>
          <canvas class="scratch-cover" tabindex="0" role="button" aria-label="Cào để xem"></canvas>
        </div>
        <button class="replay" type="button" hidden>Xem lại từ đầu</button>
      </div>
    </section>
  </main>

  <button class="music" type="button" aria-pressed="false" hidden>
    <span class="music-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="music-label"></span>
  </button>

  <dialog class="lightbox" aria-label="Ảnh">
    <figure class="lightbox-figure">
      <div class="photo lightbox-photo"></div>
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <button class="round-btn lightbox-close" type="button" aria-label="Đóng">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </dialog>

  <template id="tpl-milestone">
    <li class="milestone">
      <svg class="milestone-bud" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14"/>
        <use href="#tulip-head" transform="translate(4.8 8.1) scale(.7)"/>
      </svg>
      <figure class="milestone-card">
        <span class="tape" aria-hidden="true"></span>
        <div class="photo"></div>
        <figcaption class="milestone-caption"></figcaption>
      </figure>
    </li>
  </template>

  <template id="tpl-polaroid">
    <figure class="polaroid">
      <span class="tape" aria-hidden="true"></span>
      <button class="polaroid-open" type="button" aria-label="Xem ảnh to" tabindex="-1">
        <span class="photo"></span>
      </button>
      <figcaption class="polaroid-caption"></figcaption>
    </figure>
  </template>

  <div class="grain" aria-hidden="true"></div>
</body>
</html>
